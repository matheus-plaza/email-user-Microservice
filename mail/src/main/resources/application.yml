spring:
  datasource:
    url: jdbc:postgresql://localhost:${MAIL_DB_PORT}/${MAIL_DB_NAME}
    username: ${MAIL_DB_USER}
    password: ${MAIL_DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080