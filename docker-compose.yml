version: '3.8'

services:
  # mail microservice
  mail-db:
    image: postgres:16
    container_name: mail-db
    environment:
      POSTGRES_DB: ${MAIL_DB_NAME}
      POSTGRES_USER: ${MAIL_DB_USER}
      POSTGRES_PASSWORD: ${MAIL_DB_PASS}
    ports:
      - "${MAIL_DB_PORT}:5432"
    volumes:
      - mail-pgdata:/var/lib/postgresql/data

  # user microservice
  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASS}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user-pgdata:/var/lib/postgresql/data

volumes:
  mail-pgdata:
  user-pgdata: